name: MT6853-Kernel-A12


on:

  push:
    branches:
      - kernel-main


  schedule:
    - cron: "0 0 * * 5"


  workflow_dispatch:

    inputs:

      branch:

        description: "请输入需要编译的内核分支"

        required: true

        default: "kernel-main"

        type: string



permissions:

  contents: write



jobs:


  build:


    runs-on: ubuntu-22.04



    steps:


    # ==========================
    # Checkout
    # ==========================

    - name: Checkout kernel source

      uses: actions/checkout@v4

      with:

        ref: ${{ github.event.inputs.branch || github.ref_name }}

        fetch-depth: 10



    # ==========================
    # 环境
    # ==========================

    - name: Install dependencies

      run: |

        sudo apt update


        sudo apt install -y \
        git \
        make \
        bc \
        bison \
        flex \
        ccache \
        openssl \
        zip \
        unzip \
        kmod \
        cpio \
        libelf-dev \
        libssl-dev \
        libtfm-dev \
        device-tree-compiler \
        curl \
        wget \
        python3 \
        python2 \
        binutils \
        binutils-aarch64-linux-gnu \
        binutils-arm-linux-gnueabi


        mkdir -p $GITHUB_WORKSPACE/kernel_workspace




    # ==========================
    # GCC 4.9
    # ==========================

    - name: Download GCC 4.9


      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace



        mkdir gcc64


        wget -O gcc64.tar.gz \
        https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz


        tar -xf gcc64.tar.gz -C gcc64




        mkdir gcc32


        wget -O gcc32.tar.gz \
        https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz


        tar -xf gcc32.tar.gz -C gcc32




    # ==========================
    # Clang
    # ==========================

    - name: Download Clang NDK r24


      run: |


        cd $GITHUB_WORKSPACE/kernel_workspace


        wget -q \
        https://dl.google.com/android/repository/android-ndk-r24-linux.zip



        unzip -q android-ndk-r24-linux.zip



        mv android-ndk-r24/toolchains/llvm/prebuilt/linux-x86_64 clang-aosp



        rm android-ndk-r24-linux.zip





    # ==========================
    # ReSukiSU
    # ==========================

    - name: Install ReSukiSU


      run: |


        cd $GITHUB_WORKSPACE



        rm -rf KernelSU || true



        curl -LSs \
        https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
        | bash





    # ==========================
    # ccache
    # ==========================

    - name: Setup ccache


      uses: hendrikmuhs/ccache-action@v1.2


      with:

        key: mt6853-kernel-${{ github.event.inputs.branch || github.ref_name }}

        max-size: 2G






    # ==========================
    # 编译
    # ==========================

    - name: Build kernel


      run: |


        cd $GITHUB_WORKSPACE



        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH



        make \
        -s \
        O=out \
        ARCH=arm64 \
        mo-mt6853_defconfig




        make \
        -j$(nproc --all) \
        O=out \
        ARCH=arm64 \
        CC="ccache clang" \
        CLANG_TRIPLE=aarch64-linux-gnu- \
        CROSS_COMPILE=aarch64-linux-android- \
        CROSS_COMPILE_ARM32=arm-linux-androideabi- \
        LD=ld.lld






    # ==========================
    # AnyKernel3
    # ==========================

    - name: Build AnyKernel3


      run: |


        cd $GITHUB_WORKSPACE/kernel_workspace



        git clone \
        https://github.com/momo54181/AnyKernel3




        sed -i \
        's/do.devicecheck=1/do.devicecheck=0/g' \
        AnyKernel3/anykernel.sh



        sed -i \
        's!block=.*;!block=auto;!g' \
        AnyKernel3/anykernel.sh



        sed -i \
        's/is_slot_device=0;/is_slot_device=auto;/g' \
        AnyKernel3/anykernel.sh




        cp \
        $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb \
        AnyKernel3/



        rm -rf AnyKernel3/.git



        zip -r \
        MT6853-${{ github.event.inputs.branch || github.ref_name }}-AnyKernel3.zip \
        AnyKernel3






    # ==========================
    # Artifact
    # ==========================

    - name: Upload AnyKernel3


      uses: actions/upload-artifact@v4


      with:


        name: MT6853-AnyKernel3


        path: kernel_workspace/MT6853-${{ github.event.inputs.branch || github.ref_name }}-AnyKernel3.zip





    - name: Upload Image


      uses: actions/upload-artifact@v4


      with:


        name: Image.gz-dtb


        path: out/arch/arm64/boot/Image.gz-dtb






    # ==========================
    # Changelog
    # ==========================

    - name: Generate changelog


      id: changelog


      run: |


        echo "LOGS<<EOF" >> $GITHUB_OUTPUT


        git log --oneline -5 >> $GITHUB_OUTPUT


        echo "EOF" >> $GITHUB_OUTPUT







    # ==========================
    # Release
    # ==========================

    - name: Create Release


      uses: softprops/action-gh-release@v2


      with:


        tag_name:

          MT6853-${{ github.event.inputs.branch || github.ref_name }}-${{ github.run_id }}



        name:

          🚀 MT6853 ${{ github.event.inputs.branch || github.ref_name }} Kernel Build #${{ github.run_number }}



        body: |


          ## MT6853 Android 12 Kernel


          Branch:

          `${{ github.event.inputs.branch || github.ref_name }}`


          Compiler:

          - Android NDK r24 Clang
          - GCC 4.9


          Features:

          - ReSukiSU



          ### Changelog


          ${{ steps.changelog.outputs.LOGS }}



        files: |


          kernel_workspace/MT6853-${{ github.event.inputs.branch || github.ref_name }}-AnyKernel3.zip

          out/arch/arm64/boot/Image.gz-dtb
