name: MT6853-Kernel-A12

on:
  push:
    branches:
      - kernel-main

  workflow_dispatch:
    inputs:
      branch:
        description: "Select kernel branch"
        required: true
        default: "kernel-main"

  schedule:
    - cron: "0 0 * * 5"


permissions:
  contents: write


jobs:
  build:

    runs-on: ubuntu-22.04


    steps:


    # ==========================
    # Install dependencies
    # ==========================
    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          make \
          bc \
          bison \
          flex \
          ccache \
          openssl \
          zip \
          unzip \
          kmod \
          cpio \
          libelf-dev \
          libssl-dev \
          libtfm-dev \
          device-tree-compiler \
          curl \
          wget \
          python3 \
          python2 \
          binutils \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi


        mkdir -p $GITHUB_WORKSPACE/kernel_workspace



    # ==========================
    # Clone kernel source
    # ==========================
    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace

        git clone \
          -b ${{ github.event.inputs.branch || 'kernel-main' }} \
          --depth=10 \
          https://github.com/momo54181/android_kernel_oplus_mt6853 \
          android-kernel



    # ==========================
    # Setup ReSukiSU
    # ==========================
    - name: Update ReSukiSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        rm -rf KernelSU

        curl -LSs \
          https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
          | bash



    # ==========================
    # Collect commit info
    # ==========================
    - name: Collect kernel information
      id: buildinfo
      shell: bash
      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel


        echo "kernel_commit=$(git rev-parse --short HEAD)" \
          >> $GITHUB_OUTPUT


        echo "commits<<EOF" \
          >> $GITHUB_OUTPUT


        git log \
          --oneline \
          -10 \
          >> $GITHUB_OUTPUT


        echo "EOF" \
          >> $GITHUB_OUTPUT



    # ==========================
    # Setup swap
    # ==========================
    - name: Setup swap
      run: |

        sudo swapoff -a || true

        sudo rm -f /swapfile


        sudo fallocate \
          -l 8G \
          /swapfile \
        || sudo dd \
          if=/dev/zero \
          of=/swapfile \
          bs=1M \
          count=8192 \
          status=progress


        sudo chmod 600 /swapfile

        sudo mkswap /swapfile

        sudo swapon /swapfile


        free -h



    # ==========================
    # GCC 4.9
    # ==========================
    - name: Download GCC 4.9
      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace


        mkdir gcc64


        wget -q -O gcc64.tar.gz \
        https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz


        tar -xf gcc64.tar.gz \
          -C gcc64



        mkdir gcc32


        wget -q -O gcc32.tar.gz \
        https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz


        tar -xf gcc32.tar.gz \
          -C gcc32



    # ==========================
    # Clang21 (NDK r29)
    # ==========================
    - name: Cache clang21
      uses: actions/cache@v4
      with:
        path: kernel_workspace/clang21
        key: clang21-ndk-r28c


    - name: Download clang21
      run: |

        if [ -d "$GITHUB_WORKSPACE/kernel_workspace/clang21" ]; then
          exit 0
        fi


        cd $GITHUB_WORKSPACE/kernel_workspace


        wget -q \
        https://dl.google.com/android/repository/android-ndk-r29-linux.zip


        unzip -q android-ndk-r29-linux.zip


        mv android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64 \
          clang21


        rm android-ndk-r29-linux.zip

    # ==========================
    # Clang11 (for vanilla branch)
    # ==========================
    - name: Cache clang11
      uses: actions/cache@v4
      with:
        path: kernel_workspace/clang11
        key: clang11-crdroid-6443078


    - name: Download clang11
      run: |

        if [ -d "$GITHUB_WORKSPACE/kernel_workspace/clang11" ]; then
          exit 0
        fi


        cd $GITHUB_WORKSPACE/kernel_workspace


        git clone --depth=1 \
          https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 \
          clang11



    # ==========================
    # Select compiler
    # ==========================
    - name: Select compiler
      id: compiler
      shell: bash
      run: |

        BRANCH="${{ github.event.inputs.branch || 'kernel-main' }}"


        if [[ "$BRANCH" == *"vanilla"* ]]; then

          echo "clang=clang11" >> $GITHUB_OUTPUT

          echo "path=$GITHUB_WORKSPACE/kernel_workspace/clang11/bin" \
            >> $GITHUB_OUTPUT

        else

          echo "clang=clang21" >> $GITHUB_OUTPUT

          echo "path=$GITHUB_WORKSPACE/kernel_workspace/clang21/bin" \
            >> $GITHUB_OUTPUT

        fi



    - name: Check compiler
      run: |

        export PATH=${{ steps.compiler.outputs.path }}:$PATH

        clang --version



    # ==========================
    # Build kernel
    # ==========================
    - name: Build kernel
      shell: bash
      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel


        export PATH=${{ steps.compiler.outputs.path }}:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH


        echo "Compiler:"
        clang --version



        make -s \
          O=out \
          ARCH=arm64 \
          mo-mt6853_defconfig



        make -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          CC="ccache clang" \
          LLVM_IAS=0 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld




    # ==========================
    # Build AnyKernel3
    # ==========================
    - name: Build AnyKernel3
      shell: bash
      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace


        git clone --depth=1 \
          https://github.com/momo54181/AnyKernel3



        sed -i \
          's/do.devicecheck=1/do.devicecheck=0/g' \
          AnyKernel3/anykernel.sh



        sed -i \
          's/is_slot_device=0;/is_slot_device=auto;/g' \
          AnyKernel3/anykernel.sh



        cp \
          android-kernel/out/arch/arm64/boot/Image.gz-dtb \
          AnyKernel3/



        rm -rf \
          AnyKernel3/.git \
          AnyKernel3/README.md



        cd AnyKernel3


        zip -r \
          ../MT6853-${{ github.event.inputs.branch || 'kernel-main' }}-AnyKernel3.zip \
          .




    # ==========================
    # Upload AnyKernel3
    # ==========================
    - name: Upload AnyKernel3
      uses: actions/upload-artifact@v4
      with:

        name: MT6853-AnyKernel3

        path: |
          kernel_workspace/MT6853-*-AnyKernel3.zip




    # ==========================
    # Upload Image
    # ==========================
    - name: Upload kernel Image
      uses: actions/upload-artifact@v4
      with:

        name: MT6853-Image.gz-dtb

        path: |
          kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb




    # ==========================
    # Release
    # ==========================
    - name: Release
      uses: softprops/action-gh-release@v2

      with:

        tag_name:
          MT6853-${{ github.event.inputs.branch || 'kernel-main' }}-${{ github.run_id }}



        name:
          MT6853 Kernel ${{ github.event.inputs.branch || 'kernel-main' }}



        body: |

          ## MT6853 Kernel Build


          Branch:


          ```
          ${{ github.event.inputs.branch || 'kernel-main' }}
          ```


          Compiler:

          ```
          ${{ steps.compiler.outputs.clang }}
          ```


          Kernel Commit:

          ```
          ${{ steps.buildinfo.outputs.kernel_commit }}
          ```


          ### Latest 10 Commits

          ```
          ${{ steps.buildinfo.outputs.commits }}
          ```


          ---

          Build:
          ```
          Android 12
          MT6853
          ReSukiSU
          ```



        files: |

          kernel_workspace/MT6853-*-AnyKernel3.zip

          kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb
