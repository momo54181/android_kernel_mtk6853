name: MT6853-Kernel-A12

on:
  push:
    branches:
      - kernel-main

  workflow_dispatch:
    inputs:
      branch:
        description: "Select kernel branch"
        required: true
        default: "kernel-main"

  schedule:
    - cron: "0 0 * * 5"


permissions:
  contents: write


jobs:
  build:

    runs-on: ubuntu-22.04


    steps:

    # ==========================
    # Checkout
    # ==========================
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref_name }}
        fetch-depth: 10
        submodules: recursive


    # ==========================
    # Update KernelSU / ReSukiSU
    # ==========================
    - name: Update KernelSU
      shell: bash
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --force

        if [ -d KernelSU ]; then
          cd KernelSU

          git fetch --all

          # 修改为你的实际分支
          git checkout main
          git pull

          cd ..
        fi


    # ==========================
    # Collect build info
    # ==========================
    - name: Collect build information
      id: buildinfo
      shell: bash
      run: |

        echo "===== Kernel ====="

        KERNEL_COMMIT=$(git rev-parse --short HEAD)

        echo "kernel_commit=$KERNEL_COMMIT" >> $GITHUB_OUTPUT


        git log -10 \
          --pretty=format:"%h %s" \
          > kernel_commits.txt


        echo "commits<<EOF" >> $GITHUB_OUTPUT
        cat kernel_commits.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT



        echo "===== KernelSU ====="

        if [ -d KernelSU ]; then

          cd KernelSU


          KSU_COMMIT=$(git rev-parse --short HEAD)

          echo "ksu_commit=$KSU_COMMIT" >> $GITHUB_OUTPUT



          KSU_VERSION=$(grep -RhoE '[0-9]{5,}' . \
            | sort -nr \
            | head -1)


          if [ -z "$KSU_VERSION" ]; then
            KSU_VERSION="unknown"
          fi


          echo "ksu_version=$KSU_VERSION" >> $GITHUB_OUTPUT


          cd ..

        else

          echo "ksu_commit=none" >> $GITHUB_OUTPUT
          echo "ksu_version=none" >> $GITHUB_OUTPUT

        fi



    # ==========================
    # Dependencies
    # ==========================
    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          git \
          make \
          bc \
          bison \
          flex \
          ccache \
          openssl \
          zip \
          unzip \
          kmod \
          cpio \
          libelf-dev \
          libssl-dev \
          libtfm-dev \
          device-tree-compiler \
          curl \
          wget \
          python3 \
          python2 \
          binutils \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi


        mkdir -p $GITHUB_WORKSPACE/kernel_workspace



    # ==========================
    # Swap
    # ==========================
    - name: Setup swap
      run: |

        sudo swapoff -a || true

        sudo rm -f /swapfile


        sudo fallocate \
          -l 8G \
          /swapfile \
        || sudo dd \
          if=/dev/zero \
          of=/swapfile \
          bs=1M \
          count=8192 \
          status=progress


        sudo chmod 600 /swapfile

        sudo mkswap /swapfile

        sudo swapon /swapfile


        free -h



    # ==========================
    # GCC 4.9
    # ==========================
    - name: Download GCC 4.9
      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace


        mkdir -p gcc64

        wget -q -O gcc64.tar.gz \
        https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz


        tar -xf gcc64.tar.gz -C gcc64



        mkdir -p gcc32

        wget -q -O gcc32.tar.gz \
        https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz


        tar -xf gcc32.tar.gz -C gcc32




    # ==========================
    # Clang14
    # ==========================
    - name: Cache clang14
      uses: actions/cache@v4
      with:
        path: kernel_workspace/clang14
        key: clang14-ndk-r24


    - name: Download clang14
      run: |

        if [ -d "$GITHUB_WORKSPACE/kernel_workspace/clang14" ]; then
          exit 0
        fi


        cd $GITHUB_WORKSPACE/kernel_workspace


        wget -q \
        https://dl.google.com/android/repository/android-ndk-r24-linux.zip


        unzip -q android-ndk-r24-linux.zip


        mv android-ndk-r24/toolchains/llvm/prebuilt/linux-x86_64 clang14


        rm android-ndk-r24-linux.zip




    # ==========================
    # Clang11
    # ==========================
    - name: Cache clang11
      uses: actions/cache@v4
      with:
        path: kernel_workspace/clang11
        key: clang11-crdroid-6443078



    - name: Download clang11
      run: |

        if [ -d "$GITHUB_WORKSPACE/kernel_workspace/clang11" ]; then
          exit 0
        fi


        cd $GITHUB_WORKSPACE/kernel_workspace


        git clone --depth=1 \
        https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 \
        clang11




    # ==========================
    # Select compiler
    # ==========================
    - name: Select compiler
      id: compiler
      shell: bash
      run: |

        BRANCH="${{ github.event.inputs.branch || github.ref_name }}"


        if [[ "$BRANCH" == *"vanilla"* ]]; then

          echo "clang=clang11" >> $GITHUB_OUTPUT

          echo "path=$GITHUB_WORKSPACE/kernel_workspace/clang11/bin" >> $GITHUB_OUTPUT


        else

          echo "clang=clang14" >> $GITHUB_OUTPUT

          echo "path=$GITHUB_WORKSPACE/kernel_workspace/clang14/bin" >> $GITHUB_OUTPUT

        fi




    - name: Check compiler
      run: |

        export PATH=${{ steps.compiler.outputs.path }}:$PATH

        clang --version




    # ==========================
    # Build kernel
    # ==========================
    - name: Build kernel
      shell: bash
      run: |

        export PATH=${{ steps.compiler.outputs.path }}:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH


        make -s \
          O=out \
          ARCH=arm64 \
          mo-mt6853_defconfig



        make -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld




    # ==========================
    # AnyKernel3
    # ==========================
    - name: Build AnyKernel3
      shell: bash
      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace


        git clone --depth=1 \
        https://github.com/momo54181/AnyKernel3



        cd AnyKernel3


        sed -i \
        's/do.devicecheck=1/do.devicecheck=0/g' \
        anykernel.sh



        sed -i \
        's/is_slot_device=0;/is_slot_device=auto;/g' \
        anykernel.sh



        cp \
        $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb \
        ./



        rm -rf .git README.md



        zip -r \
        ../MT6853-${{ github.event.inputs.branch || github.ref_name }}-AnyKernel3.zip \
        .



    # ==========================
    # Upload
    # ==========================
    - name: Upload AnyKernel3
      uses: actions/upload-artifact@v4
      with:

        name: MT6853-AnyKernel3

        path: kernel_workspace/MT6853-*-AnyKernel3.zip




    # ==========================
    # Release
    # ==========================
    - name: Release
      uses: softprops/action-gh-release@v2

      with:

        tag_name:
          MT6853-${{ github.event.inputs.branch || github.ref_name }}-${{ github.run_id }}


        name:
          MT6853 Kernel ${{ github.event.inputs.branch || github.ref_name }}



        body: |

          ## MT6853 Kernel Build


          Branch:

          ```
          ${{ github.event.inputs.branch || github.ref_name }}
          ```


          Compiler:

          ```
          ${{ steps.compiler.outputs.clang }}
          ```


          ---


          ## Kernel Commit

          ```
          ${{ steps.buildinfo.outputs.kernel_commit }}
          ```


          ### Recent 10 commits

          ```
          ${{ steps.buildinfo.outputs.commits }}
          ```


          ---


          ## ReSukiSU / KernelSU


          Commit:

          ```
          ${{ steps.buildinfo.outputs.ksu_commit }}
          ```


          Version:

          ```
          ${{ steps.buildinfo.outputs.ksu_version }}
          ```



        files: |

          kernel_workspace/MT6853-*-AnyKernel3.zip

          out/arch/arm64/boot/Image.gz-dtb
