name: MT6853-Kernel-A12


on:

  push:

    branches:

      - kernel-main


  schedule:

    - cron: "0 0 * * 5"


  workflow_dispatch:

    inputs:

      branch:

        description: "Kernel branch to build"

        required: true

        default: "kernel-main"

        type: string



permissions:

  contents: write



jobs:


  build:


    runs-on: ubuntu-22.04



    steps:


    # ======================
    # Checkout
    # ======================

    - name: Checkout kernel source

      uses: actions/checkout@v4

      with:

        ref: ${{ github.event.inputs.branch || github.ref_name }}

        fetch-depth: 10



    # ======================
    # Dependencies
    # ======================

    - name: Install dependencies

      run: |

        sudo apt update


        sudo apt install -y \
        git \
        make \
        bc \
        bison \
        flex \
        ccache \
        openssl \
        zip \
        unzip \
        kmod \
        cpio \
        libelf-dev \
        libssl-dev \
        libtfm-dev \
        device-tree-compiler \
        curl \
        wget \
        python3 \
        python2 \
        binutils \
        binutils-aarch64-linux-gnu \
        binutils-arm-linux-gnueabi



        mkdir -p $GITHUB_WORKSPACE/kernel_workspace





    # ======================
    # GCC 4.9
    # ======================

    - name: Download GCC 4.9

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace


        mkdir gcc64


        wget -q -O gcc64.tar.gz \
        https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz


        tar -xf gcc64.tar.gz -C gcc64



        mkdir gcc32


        wget -q -O gcc32.tar.gz \
        https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz


        tar -xf gcc32.tar.gz -C gcc32





    # ======================
    # clang14
    # ======================

    - name: Cache clang14

      id: clang14-cache

      uses: actions/cache@v4

      with:

        path: kernel_workspace/clang14

        key: clang14-ndk-r24





    - name: Install clang14

      if: steps.clang14-cache.outputs.cache-hit != 'true'

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace



        wget -q \
        https://dl.google.com/android/repository/android-ndk-r24-linux.zip



        unzip -q android-ndk-r24-linux.zip



        mv android-ndk-r24/toolchains/llvm/prebuilt/linux-x86_64 clang14



        rm android-ndk-r24-linux.zip





    # ======================
    # clang11
    # ======================

    - name: Cache clang11

      id: clang11-cache

      uses: actions/cache@v4

      with:

        path: kernel_workspace/clang11

        key: clang11-crdroid-6443078





    - name: Install clang11

      if: steps.clang11-cache.outputs.cache-hit != 'true'

      run: |

        cd $GITHUB_WORKSPACE/kernel_workspace



        git clone \
        --depth=1 \
        https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 \
        clang11





    # ======================
    # Select clang
    # ======================

    - name: Select clang

      id: clang

      shell: bash

      run: |


        BRANCH="${{ github.event.inputs.branch || github.ref_name }}"



        if [[ "$BRANCH" == *"vanilla"* ]]; then


          echo "version=clang11" >> $GITHUB_OUTPUT

          echo "path=$GITHUB_WORKSPACE/kernel_workspace/clang11/bin" >> $GITHUB_OUTPUT


        else


          echo "version=clang14" >> $GITHUB_OUTPUT

          echo "path=$GITHUB_WORKSPACE/kernel_workspace/clang14/bin" >> $GITHUB_OUTPUT


        fi






    - name: Check compiler

      run: |

        export PATH=${{ steps.clang.outputs.path }}:$PATH


        clang --version


        which clang





    # ======================
    # ReSukiSU
    # ======================

    - name: Install ReSukiSU

      run: |


        curl -LSs \
        https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
        | bash





    # ======================
    # ccache
    # ======================

    - name: Setup ccache


      uses: hendrikmuhs/ccache-action@v1.2


      with:


        key: mt6853-${{ github.event.inputs.branch || github.ref_name }}


        max-size: 2G






    # ======================
    # Build kernel
    # ======================

    - name: Build kernel


      shell: bash


      run: |


        export PATH=${{ steps.clang.outputs.path }}:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH



        echo "Compiler:"
        clang --version



        make \
        -s \
        O=out \
        ARCH=arm64 \
        mo-mt6853_defconfig




        make \
        -j2 \
        O=out \
        ARCH=arm64 \
        CC="clang" \
        LLVM_IAS=0 \
        CLANG_TRIPLE=aarch64-linux-gnu- \
        CROSS_COMPILE=aarch64-linux-android- \
        CROSS_COMPILE_ARM32=arm-linux-androideabi- \
        LD=ld.lld





    # ======================
    # AnyKernel3
    # ======================

    - name: Build AnyKernel3


      run: |


        cd $GITHUB_WORKSPACE/kernel_workspace



        git clone \
        https://github.com/momo54181/AnyKernel3



        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' \
        AnyKernel3/anykernel.sh



        sed -i 's!block=.*;!block=auto;!g' \
        AnyKernel3/anykernel.sh



        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' \
        AnyKernel3/anykernel.sh



        cp \
        $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb \
        AnyKernel3/



        zip -r \
        MT6853-${{ github.event.inputs.branch || github.ref_name }}-AnyKernel3.zip \
        AnyKernel3





    # ======================
    # Upload
    # ======================

    - name: Upload AnyKernel3


      uses: actions/upload-artifact@v4


      with:


        name: MT6853-AnyKernel3


        path: kernel_workspace/MT6853-*-AnyKernel3.zip






    # ======================
    # Release
    # ======================

    - name: Release


      uses: softprops/action-gh-release@v2


      with:


        tag_name:

          MT6853-${{ github.event.inputs.branch || github.ref_name }}-${{ github.run_id }}



        name:

          🚀 MT6853 ${{ github.event.inputs.branch || github.ref_name }} ${{ steps.clang.outputs.version }}



        body: |


          Branch:

          ${{ github.event.inputs.branch || github.ref_name }}


          Compiler:

          ${{ steps.clang.outputs.version }}


          LLVM_IAS:

          disabled



        files: |


          kernel_workspace/MT6853-*-AnyKernel3.zip

          out/arch/arm64/boot/Image.gz-dtb
